[project]
name = "parts-identifier"
version = "2.1.0"
description = "Multimodal RAG parts identifier: field photo + damage description -> replacement part (FastAPI, Cerebras, local embeddings)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "cerebras_cloud_sdk>=1.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads the real embedding model (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
exclude = ["data/generate_catalog.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults, which is exactly how FastAPI
# declares Form/File parameters.
ignore = ["B008"]
